<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proxy URL Dashboard</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div style="{{rootStyle}}">
<div style="max-width: 1040px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--onAccent); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
</div>
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Proxy URL Dashboard</h1>
<p style="margin: 2px 0 0; font-size: 14px; color: var(--muted)">Map short slugs to destination URLs.</p>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--muted)">{{countLabel}}</div>
<button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center">
<sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
</sc-if>
</button>
</div>
</div>

<div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Add a proxy</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end">
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="slug" style="font-size: 13px; font-weight: 600; color: var(--muted)">Slug</label>
<input id="slug" type="text" placeholder="my-link" value="{{slug}}" onInput="{{onSlug}}" onKeyDown="{{onKey}}" autocomplete="off" spellcheck="false" style="height: 46px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; font-family: 'JetBrains Mono', ui-monospace, monospace">
</div>
<div style="flex: 3 1 320px; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="originalUrl" style="font-size: 13px; font-weight: 600; color: var(--muted)">Original URL</label>
<input id="originalUrl" type="url" placeholder="https://example.com/long/path" value="{{url}}" onInput="{{onUrl}}" onKeyDown="{{onKey}}" autocomplete="off" spellcheck="false" style="height: 46px; box-sizing: border-box; width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px">
</div>
<button type="button" onClick="{{add}}" style="height: 46px; padding: 0 22px; border-radius: 10px; border: 0; background: var(--accent); color: var(--onAccent); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add
</button>
</div>
<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="font-size: 14px; font-weight: 500; color: var(--danger)">{{error}}</div>
</sc-if>
</div>

<div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden">
<div style="padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border)">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">All proxies</h2>
<input type="search" aria-label="Search proxies" placeholder="Search slug or URL" value="{{query}}" onInput="{{onQuery}}" style="height: 40px; box-sizing: border-box; width: 260px; max-width: 100%; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px">
</div>
<div style="overflow-x: auto">
<div style="min-width: 640px">
<div style="display: grid; grid-template-columns: 200px minmax(0, 1fr) 128px; gap: 16px; padding: 12px 24px; background: var(--bg); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted)">
<div>Slug</div>
<div>URL</div>
<div style="text-align: right">Actions</div>
</div>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 200px minmax(0, 1fr) 128px; gap: 16px; padding: 14px 24px; align-items: center; border-top: 1px solid var(--border)">
<div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; font-weight: 500; color: var(--accent); overflow-wrap: anywhere">/{{row.slug}}</div>
<div style="font-size: 14px; color: var(--text); overflow-wrap: anywhere">{{row.url}}</div>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button type="button" onClick="{{row.copy}}" aria-label="{{row.copyAria}}" style="height: 36px; min-width: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 13px; font-weight: 600">{{row.copyText}}</button>
<button type="button" onClick="{{row.remove}}" aria-label="{{row.removeAria}}" style="height: 36px; width: 44px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--danger); display: flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"></path></svg>
</button>
</div>
</div>
</sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 48px 24px; text-align: center; border-top: 1px solid var(--border); color: var(--muted); font-size: 15px">{{emptyText}}</div>
</sc-if>
</div>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
dark: false, slug: '', url: '', query: '', error: '', copied: '',
items: [
{ id: 1, slug: 'docs', url: 'https://example.com/documentation/getting-started' },
{ id: 2, slug: 'launch-promo', url: 'https://example.com/campaigns/launch?ref=proxy' },
{ id: 3, slug: 'support', url: 'https://example.com/help-center' }
],
nextId: 4
};
}
renderVals() {
const s = this.state;
const dark = s.dark;
const t = dark
? { bg: '#0E1015', surface: '#171A22', text: '#ECEEF3', muted: '#A3ABBA', border: '#2A2F3B', accent: '#9AA2FF', onAccent: '#0E1015', danger: '#FF8A8A' }
: { bg: '#F4F5F8', surface: '#FFFFFF', text: '#14171F', muted: '#4B5565', border: '#E1E4EA', accent: '#4338CA', onAccent: '#FFFFFF', danger: '#B42318' };
const rootStyle = '--bg:' + t.bg + ';--surface:' + t.surface + ';--text:' + t.text + ';--muted:' + t.muted + ';--border:' + t.border + ';--accent:' + t.accent + ';--onAccent:' + t.onAccent + ';--danger:' + t.danger + ';background:var(--bg);color:var(--text);min-height:100vh;font-family:Inter,system-ui,sans-serif;';
const q = s.query.trim().toLowerCase();
const shown = s.items.filter((i) => !q || i.slug.includes(q) || i.url.toLowerCase().includes(q));
const rows = shown.map((i) => ({
slug: i.slug,
url: i.url,
copyText: s.copied === i.slug ? 'Copied' : 'Copy',
copyAria: 'Copy link for ' + i.slug,
removeAria: 'Delete ' + i.slug,
copy: () => {
try { navigator.clipboard.writeText(i.url); } catch (e) {}
this.setState({ copied: i.slug });
setTimeout(() => this.setState({ copied: '' }), 1500);
},
remove: () => this.setState({ items: this.state.items.filter((x) => x.id !== i.id) })
}));
return {
rootStyle, rows,
isDark: dark, isLight: !dark,
themeLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
toggleTheme: () => this.setState({ dark: !this.state.dark }),
countLabel: s.items.length + (s.items.length === 1 ? ' proxy' : ' proxies'),
slug: s.slug, url: s.url, query: s.query,
hasError: !!s.error, error: s.error,
isEmpty: shown.length === 0,
emptyText: s.items.length === 0 ? 'No proxies yet. Add your first slug above.' : 'No proxies match your search.',
onSlug: (e) => this.setState({ slug: e.target.value, error: '' }),
onUrl: (e) => this.setState({ url: e.target.value, error: '' }),
onQuery: (e) => this.setState({ query: e.target.value }),
onKey: (e) => { if (e.key === 'Enter') this.addItem(); },
add: () => this.addItem()
};
}
addItem() {
const slug = this.state.slug.trim().toLowerCase();
const url = this.state.url.trim();
if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) {
this.setState({ error: 'Slug needs lowercase letters, numbers and single hyphens.' });
return;
}
if (this.state.items.some((i) => i.slug === slug)) {
this.setState({ error: 'That slug is already in use.' });
return;
}
let ok = false;
try { const u = new URL(url); ok = u.protocol === 'http:' || u.protocol === 'https:'; } catch (e) {}
if (!ok) {
this.setState({ error: 'Enter a full URL starting with http:// or https://.' });
return;
}
this.setState({
items: [{ id: this.state.nextId, slug, url }].concat(this.state.items),
nextId: this.state.nextId + 1, slug: '', url: '', error: ''
});
}
}
</script>
</body>
</html>
